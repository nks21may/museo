# Construye la imagen y la publica en GHCR en cada push a main. El deploy en sí
# no pasa por acá: el VPS no tiene puertos abiertos (todo entra por el Cloudflare
# Tunnel, SSH incluido), así que en vez de darle acceso a un runner, el VPS tira:
# un timer de systemd baja la imagen nueva. Ver deploy/museo-deploy.service.
#
# Mismo esquema que bot_discord.

name: build & publish

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  image:
    # Runner arm porque el VPS es arm: la imagen sale nativa, sin QEMU.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # El tag por SHA es el rollback:  IMAGE_TAG=<sha> docker compose up -d
          tags: |
            ghcr.io/nks21may/museo:latest
            ghcr.io/nks21may/museo:${{ github.sha }}
          # Ata el package al repo para que herede sus permisos (privado) en vez
          # de quedar como package suelto de la cuenta.
          labels: org.opencontainers.image.source=https://github.com/nks21may/museo
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Cada push agrega una versión y las privadas consumen cuota. Cinco
      # alcanzan para volver atrás; si la poda falla, la imagen ya está publicada.
      - uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: museo
          package-type: container
          min-versions-to-keep: 5

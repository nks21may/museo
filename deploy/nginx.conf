# nginx del contenedor del museo.
#
# Detrás de Cloudflare Tunnel: el TLS lo termina Cloudflare y cloudflared entra
# por http://127.0.0.1:8420, que el compose mapea al 8080 de acá. Por eso no hay
# 443 ni redirect a https de este mismo host: ese 301 volvería al borde, que
# volvería a entrar por el túnel, en bucle.

# Cache-Control por ruta vía map y no con add_header en cada location: nginx no
# hereda add_header hacia un nivel que declara el suyo, y un location con su
# propio add_header perdería la CSP y el resto.
#
# El HTML, el CSS y el JS van sin cache: los nombres no llevan hash y una obra
# nueva cambia shaders.js. Las fuentes, las imágenes y el favicon casi nunca
# cambian. vista.mp4 es el loop que pide el hub: tampoco cambia seguido, pero el
# nombre es fijo y cuando se regraba tiene que llegar en horas, no en días.
map $uri $museo_cache_control {
    default                            "no-cache";
    ~^/fuentes/                        "public, max-age=2592000";
    ~*\.(png|jpe?g|webp|svg|ico)$      "public, max-age=604800";
    ~*\.mp4$                           "public, max-age=3600";
}

# La CSP también va por map, por la misma razón. Es una política de documentos:
# en el mp4 no protege nada y estorba, porque con `default-src 'none'` el
# navegador no lo deja abrir en una pestaña (embebido en el hub anda igual). Con
# un valor vacío nginx no manda la cabecera.
map $uri $museo_csp {
    default                            "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self' https://cloudflareinsights.com";
    ~*\.mp4$                           "";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Las conexiones llegan desde el gateway de la red de Docker, no desde la IP
    # del visitante. cloudflared manda la real en CF-Connecting-IP.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;

    # La conexión desde cloudflared es HTTP plano: sin esto, un redirect que arme
    # nginx saldría con http:// absoluto y sacaría al visitante de https.
    absolute_redirect off;

    # ── Cabeceras ───────────────────────────────────────────────────────
    # La página no tiene scripts ni estilos inline, así que la CSP es 'self' a
    # secas. Si algún día aparece un <style> o un style="" en el HTML, esto lo
    # bloquea en producción: moverlo a museo.css. Cloudflare Web Analytics está
    # permitido igual que en nicolasdalessandro.dev por si la zona lo inyecta.
    # Inyectado por la zona, el beacon reporta al mismo origen (/cdn-cgi/rum), no
    # a cloudflareinsights.com: por eso connect-src lleva 'self'. La política está
    # en el map $museo_csp, arriba.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # COOP aísla la página del museo, no sus archivos. Cross-Origin-Resource-Policy
    # no se pone a propósito: el hub (hub.nicolasdalessandro.dev) embebe /vista.mp4
    # desde otro origen, y un `same-origin` acá lo bloquearía.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy $museo_csp always;
    add_header Cache-Control $museo_cache_control always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. { return 404; }
}
